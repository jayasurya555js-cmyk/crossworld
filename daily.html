<script src="app.js"></script>
<script>
/* ------------------------------------------
   PUZZLE POOL
   Manually edit DEFAULT_PUZZLES for the built-in fallback set, or
   just edit words.txt (same folder as this page) — no code editing
   needed there. See loadPuzzlesFromFile() below for its format.
------------------------------------------ */

// Grid sizes used by the Daily Crossword page (see words.txt).
const DAILY_SIZES = [5, 6, 7, 8];

const DEFAULT_PUZZLES = [
  { size: 5, words: [["APPLE", "A fruit that can be red or green"], ["PLANT", "A living thing that grows in soil"], ["PEN", "Something you write with"], ["EAT", "What you do when you have food"], ["PEAR", "A fruit that is often shaped like a teardrop"]] },
  { size: 5, words: [["RAIN", "Water that falls from clouds"], ["WIND", "Moving air you can feel but not see"], ["SUN", "The star at the center of our solar system"], ["STORM", "Heavy wind and rain together"]] },
  { size: 5, words: [["MANGO", "A sweet tropical fruit with a large seed"], ["GRAPE", "A small fruit that grows in bunches on a vine"], ["PEAR", "A fruit that is often shaped like a teardrop"], ["LIME", "A small green citrus fruit"]] },
  { size: 6, words: [["CARROT", "An orange root vegetable"], ["TRAIN", "It runs on tracks"], ["STORM", "Heavy wind and rain together"], ["COAT", "You wear it to keep warm outside"], ["INK", "Liquid used in a pen"]] },
  { size: 6, words: [["ORANGE", "A round citrus fruit"], ["COFFEE", "A hot brown drink made from beans"], ["RAIN", "Water that falls from clouds"], ["BEACH", "A sandy place beside the sea"], ["EAGLE", "A large bird of prey"]] },
  { size: 7, words: [["WEATHER", "Rain, sun or snow, for example"], ["SHOE", "You wear it on your foot"], ["JUICE", "A drink made from squeezed fruit"], ["RADIO", "You listen to music on it"], ["HORSE", "An animal you can ride"], ["SNOW", "White flakes that fall in winter"], ["SHAPE", "A circle or a square, for example"]] },
  { size: 7, words: [["AIRPORT", "A place where planes take off and land"], ["RICE", "Small white grains often eaten with curry"], ["TRAFFIC", "Many cars on the road"], ["TRAIN", "It runs on tracks"], ["SEA", "Salt water that covers most of Earth"], ["SONG", "Words you sing to music"]] },
  { size: 8, words: [["COMPUTER", "A machine you type on"], ["CAMPFIRE", "A fire you sit around outdoors"], ["CLOCK", "It tells you the time"], ["BANANA", "A long yellow fruit monkeys love"], ["JAM", "Sweet fruit spread for bread"], ["MUD", "Wet, soft earth"], ["BIRD", "An animal with feathers and wings"]] },
  { size: 8, words: [["SHOULDER", "It connects your arm to your body"], ["RAINBOW", "A colorful arch in the sky after rain"], ["BLANKET", "A warm cover for your bed"], ["SUNSHINE", "Bright, warm light during the day"], ["ICE", "Frozen water"], ["ZEBRA", "An African animal with black and white stripes"]] }
];

// A daily puzzle entry ("spec") is just { size, words }. The crossword
// layout is only worked out when that puzzle is actually shown (see
// resolvePuzzle), so loading a words.txt with hundreds of puzzles
// stays instant.
function buildDefaultPuzzles() {
  return DEFAULT_PUZZLES.map(item => ({
    size: item.size,
    words: item.words.map(([word, clue]) => ({ word, clue }))
  }));
}

// Returns the playable layout for a puzzle entry (building and
// caching it on first use), or null if the words can't be arranged.
function resolvePuzzle(spec) {
  if (spec.layout === undefined) {
    spec.layout = generateCrossword(
      spec.words,
      spec.size || DEFAULT_SIZE,
      { preferSpan: true }
    );
  }

  return spec.layout;
}

function shuffleArray(list) {
  const copy = [...list];

  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }

  return copy;
}

// ---- Which daily puzzle comes next -------------------------------
// Puzzles are served from a shuffled queue that alternates between
// the grid sizes (5x5, 6x6, 7x7, 8x8 mixed together), and nothing
// repeats until every puzzle has been played. Puzzles already shown
// are remembered in this browser, so a page refresh doesn't bring
// the same puzzle back either.

const SEEN_KEY = "crossworld_seen_daily_v1";
let seenPuzzleIds = loadSeenPuzzles();
let dailyQueue = [];

function puzzleId(puzzle) {
  const text = puzzle.size + ":" +
    puzzle.words.map(item => item.word).sort().join(",");

  let hash = 5381;

  for (let i = 0; i < text.length; i++) {
    hash = ((hash * 33) ^ text.charCodeAt(i)) >>> 0;
  }

  return hash.toString(36);
}

function loadSeenPuzzles() {
  try {
    const list = JSON.parse(localStorage.getItem(SEEN_KEY) || "[]");
    return new Set(Array.isArray(list) ? list : []);
  } catch (error) {
    return new Set();
  }
}

function saveSeenPuzzles() {
  try {
    localStorage.setItem(SEEN_KEY, JSON.stringify([...seenPuzzleIds]));
  } catch (error) {
    // Storage blocked (private mode etc.) — in-memory tracking still works.
  }
}

function markPuzzleSeen(puzzle) {
  const id = puzzleId(puzzle);

  if (!seenPuzzleIds.has(id)) {
    seenPuzzleIds.add(id);
    saveSeenPuzzles();
  }
}

function buildDailyQueue(lastIndex) {
  let pool = PUZZLES
    .map((puzzle, index) => index)
    .filter(index =>
      PUZZLES[index].layout !== null &&
      !seenPuzzleIds.has(puzzleId(PUZZLES[index]))
    );

  // Everything has been played: start a fresh round.
  if (pool.length === 0) {
    seenPuzzleIds.clear();
    saveSeenPuzzles();
    pool = PUZZLES
      .map((puzzle, index) => index)
      .filter(index => PUZZLES[index].layout !== null);
  }

  const bySize = new Map();

  shuffleArray(pool).forEach(index => {
    const size = PUZZLES[index].size || DEFAULT_SIZE;

    if (!bySize.has(size)) bySize.set(size, []);
    bySize.get(size).push(index);
  });

  // Deal one puzzle from each size in turn, so sizes keep alternating.
  const groups = shuffleArray([...bySize.values()]);
  const queue = [];

  while (groups.some(group => group.length > 0)) {
    groups.forEach(group => {
      if (group.length > 0) queue.push(group.shift());
    });
  }

  // Never open a new round with the puzzle that was just on screen.
  if (queue.length > 1 && queue[0] === lastIndex) {
    queue.push(queue.shift());
  }

  return queue;
}

// Returns the index of the next daily puzzle, different from
// excludeIndex whenever there is more than one puzzle. The returned
// puzzle always has a playable layout.
function pickRandomPuzzleIndex(excludeIndex) {

  for (let attempt = 0; attempt < PUZZLES.length + 5; attempt++) {

    let next = 0;

    if (PUZZLES.length > 1) {
      if (dailyQueue.length === 0) {
        dailyQueue = buildDailyQueue(excludeIndex);
      }

      next = dailyQueue.shift();

      if (next === excludeIndex && dailyQueue.length > 0) {
        dailyQueue.push(next);
        next = dailyQueue.shift();
      }
    }

    if (next !== undefined && PUZZLES[next] && resolvePuzzle(PUZZLES[next])) {
      return next;
    }
  }

  // Nothing usable (should never happen): fall back to the demo puzzle.
  PUZZLES = [fallbackPuzzleEntry()];
  dailyQueue = [];
  return 0;
}

function fallbackPuzzleEntry() {
  return {
    size: DAILY_PUZZLE.size,
    words: DAILY_PUZZLE.words,
    layout: DAILY_PUZZLE
  };
}

let PUZZLES = buildDefaultPuzzles();
if (PUZZLES.length === 0) PUZZLES = [fallbackPuzzleEntry()];

let dailyGame = null;
let dailyTimer = 0;
let dailyInterval = null;
let dailyPuzzleIndex = -1;
let dailyAwaitingNextPuzzle = false;

/* ------------------------------------------
   GAME SETUP
------------------------------------------ */

function startDailyGame() {

  clearInterval(dailyInterval);
  dailyTimer = 0;

  setCheckButtonMode(false);

  const dailyPuzzle = resolvePuzzle(PUZZLES[dailyPuzzleIndex]);
  const dailySize = dailyPuzzle.size || DEFAULT_SIZE;

  markPuzzleSeen(PUZZLES[dailyPuzzleIndex]);
  $("daily-subtitle").textContent =
    `${dailySize} × ${dailySize} Crossword Puzzle`;

  dailyGame = new CrosswordGame(
    dailyPuzzle,
    $("daily-grid"),
    $("across-clues"),
    $("down-clues"),
    {
      onProgress: (filled, total) => {
        $("progress-text").textContent =
          `${filled} / ${total}`;

        $("progress-bar").style.width =
          `${(filled / total) * 100}%`;
      },

      onHintChange: (hintsLeft) => {
        updateHintButton("hint-btn", hintsLeft);
      }
    }
  );

  dailyInterval = setInterval(() => {
    dailyTimer++;
    $("timer").textContent = formatTime(dailyTimer);
  }, 1000);

  setStatus("daily-status", "");
}

function goToNextDailyPuzzle() {
  clearInterval(dailyInterval);

  dailyPuzzleIndex = pickRandomPuzzleIndex(dailyPuzzleIndex);
  startDailyGame();
}

function setCheckButtonMode(awaitingNext) {
  const button = $("check-btn");

  dailyAwaitingNextPuzzle = awaitingNext;

  button.textContent = awaitingNext
    ? "➡ Next Puzzle"
    : "✓ Check";
}

/* ------------------------------------------
   DAILY PUZZLE ACTIONS
------------------------------------------ */

$("check-btn").addEventListener("click", () => {

  if (dailyAwaitingNextPuzzle) {
    goToNextDailyPuzzle();
    return;
  }

  if (!dailyGame) return;

  const result = dailyGame.checkAnswers();

  if (result.filled === 0) {
    setStatus(
      "daily-status",
      "Fill in some letters before checking.",
      "error"
    );
    return;
  }

  if (result.correct === result.total) {

    clearInterval(dailyInterval);

    const hasNextPuzzle = PUZZLES.length > 1;

    trackEvent("puzzle_solved", {
      puzzle_type: "daily",
      seconds_taken: dailyTimer,
      hints_used: dailyGame.hintsUsed
    });

    setStatus(
      "daily-status",
      `🎉 Congratulations! You solved the puzzle in ${formatTime(dailyTimer)}.`,
      "success"
    );

    if (hasNextPuzzle) {
      setCheckButtonMode(true);
    }

  } else {
    setStatus(
      "daily-status",
      `${result.correct} of ${result.total} filled cells are correct. Keep going!`,
      "error"
    );
  }
});

$("hint-btn").addEventListener("click", () => {
  dailyGame.revealHint();
});

$("reset-btn").addEventListener("click", () => {
  startDailyGame();
  setStatus("daily-status", "");
});

wireUpKeyboardInput(() => dailyGame);

/* ------------------------------------------
   LOAD WORDS & HINTS FROM A TEXT FILE
   Edit words.txt (same folder as this page) to change or add
   puzzles — no code editing needed.

   Format of words.txt:
     WORD | Clue text for that word
   A line like "GRID: 6x6" (or "[6x6]") sets the grid size for every
   puzzle below it, until the next GRID line. Valid sizes are 5, 6,
   7, and 8 — anything before the first GRID line defaults to 5x5.
   Separate each puzzle's group of words with a line containing only
   ---. Lines starting with # are ignored as comments.
------------------------------------------ */

function parsePuzzleFile(text) {

  const puzzles = [];

  // Grid size for the puzzles that follow. A block with no GRID line
  // above it is 5x5, so an older words.txt keeps working unchanged.
  let size = DEFAULT_SIZE;
  let current = [];

  function flush() {
    const words = current;
    current = [];

    if (words.length < 2) return;

    if (size === null) {
      console.warn("words.txt: skipped a puzzle under an unsupported GRID size.");
      return;
    }

    // The crossword layout is built later, when the puzzle is shown.
    puzzles.push({ size, words });
  }

  text.split(/\r?\n/).forEach(rawLine => {

    const line = rawLine.trim();

    if (!line || line.startsWith("#")) return;

    // "---" ends the current puzzle.
    if (/^-{3,}$/.test(line)) {
      flush();
      return;
    }

    // "GRID: 6x6" (or "[6x6]") sets the size for the puzzles below.
    const header = line.match(
      /^(?:grid\s*[:=]?\s*|\[)\s*(\d+)\s*[x×*]\s*(\d+)\s*\]?$/i
    );

    if (header) {
      flush();

      const rows = Number(header[1]);
      const cols = Number(header[2]);

      size = (
        rows === cols &&
        DAILY_SIZES.includes(rows)
      ) ? rows : null;

      return;
    }

    const separatorIndex = line.indexOf("|");

    if (separatorIndex === -1) return;

    const word = cleanWord(line.slice(0, separatorIndex));
    const clue = line.slice(separatorIndex + 1).trim();

    if (
      size !== null &&
      word.length >= 2 &&
      word.length <= size &&
      clue
    ) {
      current.push({ word, clue });
    }
  });

  flush();

  return puzzles;
}

async function loadPuzzlesFromFile() {
  // "word.txt" is accepted as a fallback name in case the file was
  // saved without the "s".
  const fileNames = ["words.txt", "word.txt"];

  for (const fileName of fileNames) {
    try {
      const response = await fetch(fileName, { cache: "no-store" });

      if (!response.ok) {
        throw new Error(fileName + " could not be fetched");
      }

      const text = await response.text();
      const puzzles = parsePuzzleFile(text);

      if (puzzles.length === 0) {
        console.warn(fileName + " had no valid puzzles.");
        continue;
      }

      return puzzles;

    } catch (error) {
      // Expected if the file is missing, or if the page is opened
      // directly as a local file:// URL instead of over http(s).
      console.warn("Could not load " + fileName, error);
    }
  }

  console.warn("Using the built-in puzzles instead.");
  return null;
}

/* ------------------------------------------
   INITIALIZE
------------------------------------------ */

initAds();

loadPuzzlesFromFile().then(puzzles => {
  if (puzzles) {
    PUZZLES = puzzles;
  }

  dailyQueue = [];
  dailyPuzzleIndex = pickRandomPuzzleIndex(dailyPuzzleIndex);
  startDailyGame();
});

</script>
