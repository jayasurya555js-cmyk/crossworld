<!-- Hidden input used only to summon the mobile on-screen keyboard.
     Mobile browsers only pop up a virtual keyboard when a real
     focusable <input> receives focus, so cell clicks focus this
     instead of relying on physical keydown events alone. -->
<input
  type="text"
  id="key-capture"
  autocomplete="off"
  autocorrect="off"
  autocapitalize="characters"
  spellcheck="false"
  inputmode="text"
  aria-hidden="true"
  tabindex="-1"

      <section class="card grid-panel" aria-label="Word search game">

  </div>

</section>

<div id="site-footer"></div>

<script src="app.js"></script>
<script>
/* ------------------------------------------
   THEMED WORD LISTS
   Word Search doesn't need words to cross each other the way a
   crossword does, so these are simple themed lists rather than
   words.txt-style clue pairs.
------------------------------------------ */

const WORD_SEARCH_SIZE = 12;

const WORD_SEARCH_THEMES = [
  { name: "Animals", words: ["LION", "TIGER", "ZEBRA", "ELEPHANT", "GIRAFFE", "MONKEY", "PANDA", "DOLPHIN"] },
  { name: "Fruits", words: ["APPLE", "BANANA", "ORANGE", "GRAPE", "MANGO", "LEMON", "PEACH", "CHERRY"] },
  { name: "Ocean", words: ["WHALE", "SHARK", "OCTOPUS", "DOLPHIN", "CORAL", "TURTLE", "JELLYFISH", "STARFISH"] },
  { name: "Space", words: ["PLANET", "GALAXY", "COMET", "ROCKET", "ASTEROID", "SATURN", "ORBIT", "ASTRONAUT"] },
  { name: "Sports", words: ["SOCCER", "TENNIS", "HOCKEY", "BASEBALL", "BOXING", "CYCLING", "SWIMMING", "GOLF"] },
  { name: "School", words: ["PENCIL", "NOTEBOOK", "TEACHER", "STUDENT", "LIBRARY", "SCIENCE", "HOMEWORK", "LESSON"] },
  { name: "Weather", words: ["RAINBOW", "THUNDER", "LIGHTNING", "BREEZE", "DROUGHT", "BLIZZARD", "HUMIDITY", "FORECAST"] },
  { name: "Kitchen", words: ["KETTLE", "SPATULA", "BLENDER", "SKILLET", "COLANDER", "WHISK", "TOASTER", "PLATTER"] }
];

let wsGame = null;
let wsTimer = 0;
let wsInterval = null;
let wsThemeIndex = -1;

function pickRandomThemeIndex(excludeIndex) {
  if (WORD_SEARCH_THEMES.length <= 1) return 0;

  let index;
  do {
    index = Math.floor(Math.random() * WORD_SEARCH_THEMES.length);
  } while (index === excludeIndex);

  return index;
}

/* ------------------------------------------
   GAME SETUP
------------------------------------------ */

function startWordSearchGame() {

  clearInterval(wsInterval);
  wsTimer = 0;

  const theme = WORD_SEARCH_THEMES[wsThemeIndex];
  const puzzle = generateWordSearch(theme.words, WORD_SEARCH_SIZE);

  $("ws-theme-name").textContent = theme.name;

  wsGame = new WordSearchGame(
    puzzle,
    $("ws-grid"),
    $("ws-word-list"),
    {
      onProgress: (found, total) => {
        $("ws-progress-text").textContent = `${found} / ${total}`;
        $("ws-progress-bar").style.width = `${(found / total) * 100}%`;
      },

      onComplete: () => {
        clearInterval(wsInterval);

        trackEvent("puzzle_solved", {
          puzzle_type: "wordsearch",
          theme: theme.name,
          seconds_taken: wsTimer,
          hints_used: wsGame.hintsUsed
        });

        setStatus(
          "ws-status",
          `🎉 Great job! You found every word in ${formatTime(wsTimer)}.`,
          "success"
        );
      },

      onHintChange: (hintsLeft) => {
        updateHintButton("ws-hint-btn", hintsLeft);
      }
    }
  );

  wsInterval = setInterval(() => {
    wsTimer++;
    $("ws-timer").textContent = formatTime(wsTimer);
  }, 1000);

  setStatus("ws-status", "");
}

function goToNextWordSearch() {
  wsThemeIndex = pickRandomThemeIndex(wsThemeIndex);
  startWordSearchGame();
}

/* ------------------------------------------
   WORD SEARCH ACTIONS
------------------------------------------ */

$("ws-hint-btn").addEventListener("click", () => {
  if (wsGame) wsGame.revealHint();
});

$("ws-reset-btn").addEventListener("click", () => {
  startWordSearchGame();
});

$("ws-new-btn").addEventListener("click", () => {
  goToNextWordSearch();
});

/* ------------------------------------------
   INITIALIZE
------------------------------------------ */

renderHeader("wordsearch");
renderFooter();
initAds();

wsThemeIndex = pickRandomThemeIndex(wsThemeIndex);
startWordSearchGame();

</script>
