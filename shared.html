<!-- Hidden input used only to summon the mobile on-screen keyboard.
     Mobile browsers only pop up a virtual keyboard when a real
     focusable <input> receives focus, so cell clicks focus this
     instead of relying on physical keydown events alone. -->
<input
  type="text"
  id="key-capture"
  autocomplete="off"
  autocorrect="off"
  autocapitalize="characters"
  spellcheck="false"
  inputmode="text"
  aria-hidden="true"
  tabindex="-1"
/>

<div id="site-header"></div>

<main>
<!-- =========================
     SHARED PUZZLE PAGE
========================= -->

<section class="page" aria-labelledby="shared-title">

  <div class="container puzzle-header">
    <span class="eyebrow">Friend challenge</span>
    <h1 id="shared-title">Solve this crossword</h1>
    <p id="shared-subtitle">
      A custom puzzle shared with you.
    </p>
  </div>

  <div class="container section">
    <div class="puzzle-layout">

      <section class="card grid-panel">
        <div class="grid-panel-top">
          <strong id="shared-puzzle-name">Friend's Crossword</strong>
          <span class="timer" id="shared-timer">00:00</span>
        </div>

        <div
          id="shared-grid"
          class="crossword-grid"
          role="group"
          aria-label="Shared crossword grid">
        </div>

        <div class="progress-wrap">
          <div class="progress-label">
            <span>Progress</span>
            <span id="shared-progress-text">0 / 25</span>
          </div>
          <div class="progress-track">
            <div class="progress-bar" id="shared-progress-bar"></div>
          </div>
        </div>

        <div class="grid-actions">
          <button class="btn btn-secondary" id="shared-check-btn">
            ✓ Check
          </button>

          <button class="btn btn-secondary" id="shared-hint-btn">
            💡 Hint (3 left)
          </button>

          <button class="btn btn-secondary" id="shared-reset-btn">
            ↺ Reset
          </button>
        </div>

        <div id="shared-status"
             class="status-message"
             role="status"
             aria-live="polite">
        </div>
      </section>

      <aside class="clues-panel">
        <section class="card clue-group">
          <h3>Across</h3>
          <div id="shared-across-clues" class="clue-list"></div>
        </section>

        <section class="card clue-group">
          <h3>Down</h3>
          <div id="shared-down-clues" class="clue-list"></div>
        </section>
      </aside>

    </div>
  </div>

</section>
</main>

<div id="site-footer"></div>

<script src="app.js"></script>
<script>
let sharedGame = null;
let sharedTimer = 0;
let sharedInterval = null;

/* ------------------------------------------
   GAME SETUP
------------------------------------------ */

function startSharedGame(puzzle) {

  clearInterval(sharedInterval);
  sharedTimer = 0;

  sharedGame = new CrosswordGame(
    puzzle,
    $("shared-grid"),
    $("shared-across-clues"),
    $("shared-down-clues"),
    {
      onProgress: (filled, total) => {
        $("shared-progress-text").textContent =
          `${filled} / ${total}`;

        $("shared-progress-bar").style.width =
          `${(filled / total) * 100}%`;
      },

      onHintChange: (hintsLeft) => {
        updateHintButton("shared-hint-btn", hintsLeft);
      }
    }
  );

  sharedInterval = setInterval(() => {
    sharedTimer++;
    $("shared-timer").textContent = formatTime(sharedTimer);
  }, 1000);

  setStatus("shared-status", "");
}

/* ------------------------------------------
   LOAD THE SHARED PUZZLE FROM THE URL
------------------------------------------ */

function loadSharedPuzzle() {

  const hash = window.location.hash;

  if (!hash.startsWith("#puzzle=")) {
    window.location.href = "index.html";
    return;
  }

  const encoded = hash.substring("#puzzle=".length);
  const puzzle = decodePuzzle(encoded);

  if (!puzzle || !Array.isArray(puzzle.words)) {
    alert("This puzzle link is invalid or expired.");
    window.location.href = "index.html";
    return;
  }

  puzzle.size = puzzle.size || DEFAULT_SIZE;

  const sizeOk =
    Number.isInteger(puzzle.size) &&
    puzzle.size >= 5 &&
    puzzle.size <= 8;

  const wordsOk = sizeOk && puzzle.words.every(item => {
    if (
      !item ||
      typeof item.word !== "string" ||
      !Number.isInteger(item.row) ||
      !Number.isInteger(item.col) ||
      (item.direction !== "across" && item.direction !== "down")
    ) {
      return false;
    }

    const length = cleanWord(item.word).length;
    const endRow = item.row + (item.direction === "down" ? length - 1 : 0);
    const endCol = item.col + (item.direction === "across" ? length - 1 : 0);

    return length > 0 &&
      item.row >= 0 && item.col >= 0 &&
      endRow < puzzle.size && endCol < puzzle.size;
  });

  if (!wordsOk || puzzle.words.length === 0) {
    alert("This puzzle is not supported by this prototype.");
    window.location.href = "index.html";
    return;
  }

  $("shared-puzzle-name").textContent =
    puzzle.title || "Friend's Crossword";

  $("shared-subtitle").textContent =
    `A custom ${puzzle.size} × ${puzzle.size} crossword shared with you.`;

  startSharedGame(puzzle);
}

/* ------------------------------------------
   SHARED PUZZLE ACTIONS
------------------------------------------ */

$("shared-check-btn").addEventListener("click", () => {

  if (!sharedGame) return;

  const result = sharedGame.checkAnswers();

  if (result.filled === 0) {
    setStatus(
      "shared-status",
      "Fill in some letters before checking.",
      "error"
    );
    return;
  }

  if (result.correct === result.total) {
    clearInterval(sharedInterval);

    trackEvent("puzzle_solved", {
      puzzle_type: "shared",
      seconds_taken: sharedTimer,
      hints_used: sharedGame.hintsUsed
    });

    setStatus(
      "shared-status",
      `🎉 You solved the crossword in ${formatTime(sharedTimer)}!`,
      "success"
    );
  } else {
    setStatus(
      "shared-status",
      `${result.correct} of ${result.total} filled cells are correct. Keep going!`,
      "error"
    );
  }
});

$("shared-hint-btn").addEventListener("click", () => {
  if (!sharedGame) return;
  sharedGame.revealHint();
});

$("shared-reset-btn").addEventListener("click", () => {
  if (!sharedGame) return;
  startSharedGame(sharedGame.puzzle);
  setStatus("shared-status", "");
});

wireUpKeyboardInput(() => sharedGame);

// If the hash changes while already on this page (e.g. a second
// puzzle link was opened in the same tab), load the new one.
window.addEventListener("hashchange", loadSharedPuzzle);

/* ------------------------------------------
   INITIALIZE
------------------------------------------ */

renderHeader("");
renderFooter();
loadSharedPuzzle();
initAds();

</script>

</body>
</html>
