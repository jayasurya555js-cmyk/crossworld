<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Slice arcade game</title>
  <desc id="desc">Colorful fruit, a swipe trail, and a bomb in a playful arcade scene.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#102b4e"/>
      <stop offset="1" stop-color="#193f55"/>
    </linearGradient>
    <linearGradient id="trail" x2="1">
      <stop stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff"/>
      <stop offset="1" stop-color="#a4f5e4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <text x="78" y="205" fill="#a4f5e4" font-family="Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="7">SLICE ARCADE</text>
  <text x="74" y="292" fill="#fff" font-family="Arial,sans-serif" font-size="68" font-weight="800">Swipe. Slice. Score.</text>
  <text x="80" y="360" fill="#d1e4ee" font-family="Arial,sans-serif" font-size="32">Keep clear of the bombs.</text>
  <path d="M632 414Q832 175 1110 237" fill="none" stroke="url(#trail)" stroke-width="18" stroke-linecap="round"/>
